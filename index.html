<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>GNSS Accuracy Project</title>
    
    <!-- Leaflet CSS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <link rel="stylesheet" href="style.css">
    
    <!-- Libraries -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@turf/turf@6/turf.min.js"></script>
</head>
<body>
    <div class="app-container">
        <header>
            <h1>GNSS Accuracy Test</h1>
            <p>Smartphone vs. Survey-Grade Baseline</p>
        </header>

        <main>
            <!-- Live Status Card -->
            <section class="card status-card">
                <div class="status-header">
                    <h2>Live GPS Status</h2>
                    <span id="status-indicator" class="indicator"></span>
                </div>
                <div class="metrics">
                    <div class="metric">
                        <span class="label">Est. Accuracy</span>
                        <span class="value" id="live-accuracy">-- m</span>
                    </div>
                    <div class="metric">
                        <span class="label">Coordinates</span>
                        <span class="value coordinate-text" id="live-coords">Waiting for fix...</span>
                    </div>
                </div>
            </section>

            <!-- Map Visualization Card -->
            <section class="card map-card">
                <div id="map"></div>
            </section>

            <!-- Control Area -->
            <section class="action-area">
                <button id="btn-record" class="btn-primary" disabled>
                    <span class="icon">📍</span> Record Point
                </button>
            </section>

            <!-- Data & Results Card -->
            <section class="card data-card">
                <div class="data-header">
                    <h2>Recorded Points (<span id="point-count">0</span>)</h2>
                    <button id="btn-clear" class="btn-text">Clear</button>
                </div>
                
                <ul id="point-list" class="point-list">
                    <li class="empty-state">No points recorded yet.</li>
                </ul>

                <div class="results-area">
                    <h3>Calculated Area</h3>
                    <p class="area-value" id="area-display">0.00 m²</p>
                    <small id="area-note">Add at least 3 points</small>
                </div>

                <button id="btn-export" class="btn-secondary">
                    <span class="icon">📥</span> Export CSV for Trimble Compare
                </button>
            </section>
        </main>
    </div>

    <script src="app.js"></script>
</body>
</html>
